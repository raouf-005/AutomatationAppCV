<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>StageAuto</title>
<style>
:root{--bg:#f5f6f8;--fg:#1b2230;--muted:#5d6878;--accent:#1f7a4d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11151b;--fg:#e3e8ef;--muted:#98a3b3;--accent:#5cc28e;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.c{max-width:480px;padding:24px;text-align:center}
.t{color:var(--accent);font-weight:700;letter-spacing:.02em}
h1{font-size:20px;margin:8px 0 12px}
p{color:var(--muted);margin:0}
</style></head>
<body><div class="c"><div class="t">StageAuto</div><h1 id="t">Fenêtre de travail</h1>
<p>L'application ouvre ses onglets dans cette fenêtre et y déplace son curseur vert. Laisse-la ouverte ; tu peux la placer
où tu veux, par exemple sur un second écran, pour regarder ce qu'elle fait.</p></div>
<script src="lane.js"></script></body></html>
